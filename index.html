<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encrypted Chat Room</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login-page">
    <h1>🔐 Encrypted Chat</h1>
    <p class="subtitle">Enter password to view chat history</p>
    <input id="password" type="password" placeholder="Password" />
    <button id="login-btn">Login</button>
    <p id="login-error" class="error"></p>
  </div>
  
  <div id="chat-page" style="display:none;">
    <h1>🔒 Encrypted Chat</h1>
    <div id="messages"></div>
    <form id="message-form">
      <input id="msg-input" type="text" placeholder="Type a message..." disabled>
      <button type="submit" disabled>Send</button>
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
